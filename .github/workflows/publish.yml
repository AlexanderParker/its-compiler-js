name: Test and Publish to NPM

on:
  push:
    tags:
      - 'v*'
  # Lets a failed release be retried without moving or recreating the tag.
  workflow_dispatch:

# Stated explicitly because the repository default is write. Jobs that need
# more say so themselves; nothing inherits write access.
permissions:
  contents: read
  # Declared at workflow level rather than on the job. A job-level grant does
  # not elevate when the repository default is read; a workflow-level one does.
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Build package
        run: npm run build

  publish:
    runs-on: ubuntu-latest
    name: Publish to NPM
    needs: test # publish only runs if the tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node 22.14 or later.
          node-version: '22'
          cache: 'npm'
          # registry-url is deliberately NOT set here. It makes setup-node write
          # an .npmrc containing a placeholder auth token, which npm then uses
          # in preference to the OIDC exchange. The publish authenticates as
          # nobody and the registry answers 404, because it reports an
          # unauthorised write as a missing package.

      # The npm bundled with Node 22 predates trusted publishing, which needs
      # npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      # Fails fast with a readable reason rather than letting npm report a
      # bare ENEEDAUTH, which says nothing about which precondition is missing.
      - name: Preflight
        run: |
          echo "node $(node --version), npm $(npm --version)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token endpoint. id-token: write was not granted to this job."
            exit 1
          fi
          echo "OIDC token endpoint is available"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # Provenance is attached automatically when publishing this way.
      - name: Publish to NPM
        run: npm publish
