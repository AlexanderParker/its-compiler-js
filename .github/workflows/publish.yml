name: Test and Publish to NPM

on:
  push:
    tags:
      - 'v*'
  # Lets a failed release be retried without moving or recreating the tag.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Build package
        run: npm run build

  publish:
    runs-on: ubuntu-latest
    name: Publish to NPM
    needs: test # publish only runs if the tests pass

    permissions:
      contents: read
      # Trusted publishing: lets GitHub mint the OIDC token npm exchanges for
      # publish rights, so there is no NPM_TOKEN to store or rotate.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node 22.14 or later.
          node-version: '22'
          cache: 'npm'
          # registry-url is deliberately NOT set here. It makes setup-node write
          # an .npmrc containing a placeholder auth token, which npm then uses
          # in preference to the OIDC exchange. The publish authenticates as
          # nobody and the registry answers 404, because it reports an
          # unauthorised write as a missing package.

      # The npm bundled with Node 22 predates trusted publishing, which needs
      # npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # Provenance is attached automatically when publishing this way.
      - name: Publish to NPM
        run: npm publish
